# ODATest — SideStore On-Device Anisette（AnisetteKit）真機測試 App
# 用 XcodeGen 生成項目，設定盡量精簡
name: ODATest
options:
  bundleIdPrefix: com.pax
  deploymentTarget:
    iOS: "15.0"
packages:
  AnisetteKit:
    url: https://github.com/mahee96/AnisetteKit.git
    branch: main
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
targets:
  ODATest:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - ODATest
    dependencies:
      - package: AnisetteKit
        product: AnisetteKit
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pax.odatest
        PRODUCT_NAME: ODATest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: ODATest/Info.plist
      properties:
        CFBundleDisplayName: ODA測試
        CFBundleName: ODATest
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
