# ODATest — SideStore On-Device Anisette 登入測試 App
# 用 XcodeGen 生成項目，設定盡量精簡
name: ODATest
options:
  bundleIdPrefix: com.pax
  deploymentTarget:
    iOS: "15.0"
packages:
  SideSign:
    url: https://github.com/SideStore/SideSign.git
    branch: main
targets:
  ODATest:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - ODATest
    dependencies:
      - package: SideSign
        product: SideSign
    entitlements:
      path: ODATest.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pax.odatest
        PRODUCT_NAME: ODATest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # ApparitionAnisette 靜態庫（scripts/build-anisette.sh 先行構建，佈局比照 Apparition 上游）
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/anisette-out/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/anisette-out/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lapparition_anisette
    info:
      path: ODATest/Info.plist
      properties:
        CFBundleDisplayName: ODA登入測試
        CFBundleName: ODATest
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
