# 在 GitHub Actions 上編譯 ODATest 並打出未簽名 IPA
# 所有註釋使用正體中文
name: Build ODATest IPA

on:
  workflow_dispatch:
  push:
    branches: [main, feat/apparition-engine]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 安裝 Rust（aarch64-apple-ios）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 構建 ApparitionAnisette 靜態庫
        run: bash scripts/build-anisette.sh

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 選擇兼容的 Xcode
        run: |
          ls /Applications/ | grep Xcode
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            echo "沒有舊版 Xcode，用默認的"
          fi
          xcodebuild -version

      - name: 生成 Xcode 項目
        run: xcodegen generate

      - name: 編譯並打包（不簽名）
        run: |
          xcodebuild archive \
            -scheme ODATest \
            -destination 'generic/platform=iOS' \
            -archivePath build/ODATest.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ipa/Payload
          cp -R build/ODATest.xcarchive/Products/Applications/ODATest.app build/ipa/Payload/
          # 用 ldid 嵌入 entitlements（TrollStore 自家簽名器，行為可預期）：
          # 先前用 codesign 簽出的包 entitlements 是空 Dict（#9 實測），故換 ldid，
          # 並在 CI 內驗證 get-task-allow 真的寫進去了，缺了直接紅，不再靜默出空包。
          brew install ldid
          echo "=== entitlements 輸入檔 ==="
          cat ODATest.entitlements
          ldid -SODATest.entitlements build/ipa/Payload/ODATest.app
          echo "=== embedded entitlements（ldid -e）==="
          ldid -e build/ipa/Payload/ODATest.app/ODATest | tee /tmp/embedded-entitlements.plist
          grep -q 'get-task-allow' /tmp/embedded-entitlements.plist || { echo '❌ get-task-allow 未嵌入，停止出包'; exit 1; }
          grep -q 'increased-memory-limit' /tmp/embedded-entitlements.plist || { echo '❌ increased-memory-limit 未嵌入'; exit 1; }
          echo "✅ entitlements 已驗證嵌入"
          cd build/ipa && zip -r ../ODATest-unsigned.ipa Payload

      - name: 上傳未簽名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ODATest-unsigned-ipa
          path: build/ODATest-unsigned.ipa
