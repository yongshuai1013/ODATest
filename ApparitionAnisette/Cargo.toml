# ApparitionAnisette — Apparition's in-process ADI anisette engine
# (native ELF loader + shim + ADI driver), ported as a standalone crate
# for ODATest on iOS 15. See NOTICE for provenance and licence.
#
# MIT License, Copyright (c) 2026 Illixion (upstream portions).

[package]
name = "apparition-anisette"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Apparition's Android-library ADI engine (ELF loader, shim, ADI driver) as a static library for ODATest / iOS 15"

[lib]
name = "apparition_anisette"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
# Apparition's vendored isideload 0.5.0 (their 8 patches + our AnisetteData::new),
# for the "their Rust login" path: GrandSlam SRP/2FA + developer session.
isideload = { path = "vendor/isideload", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
plist = "1.8"
plist-macro = "0.1.4"
serde_json = "1"
# Same rustls build isideload uses; the login installs its ring provider
# process-wide (reqwest is built rustls-no-provider and panics otherwise).
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
http = "1.4"
